syntax = "proto3";
option csharp_namespace = "ShoppingCart.Contracts.V1";
package shoppingcart.v1;

// Gateway and backend contract for core Auth and User services (5 golden APIs).
// Additional services can be added incrementally by the team as microservices are developed.

service UsersApi {
  // Core Auth & Profile APIs
  rpc Register(RegisterRequest) returns (UserProfile);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (UserProfile);
  rpc ResendOtp(ResendOtpRequest) returns (OtpResponse);
  rpc GetProfile(UserRequest) returns (UserProfile);
}

// Common
message Empty {}
message UserRequest { string user_id = 1; }

// Auth & User Profile Messages
message UserProfile {
  string id = 1;
  string display_name = 2;
  string email = 3;
  repeated string roles = 4;
  string status = 5;
  string shop_name = 6;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string first_name = 5;
  string last_name = 6;
  string phone_number = 7;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string expires_at = 2;
  string user_id = 3;
  repeated string roles = 4;
}

message VerifyOtpRequest {
  string email = 1;
  string otp = 2;
}

message ResendOtpRequest {
  string email = 1;
}

message OtpResponse {
  bool success = 1;
  string message = 2;
  string email = 3;
}

//Notification APIs
// Notification APIs
service NotificationApi {
  rpc ListNotifications(ListNotificationsRequest)
      returns (NotificationPage);

  rpc MarkNotificationRead(MarkNotificationReadRequest)
      returns (Notification);
}

message ListNotificationsRequest {
  int32 page_index = 1;
  int32 page_size = 2;
}

message MarkNotificationReadRequest {
  string id = 1;
}

message Notification {
  string id = 1;
  string title = 2;
  string body = 3;
  bool is_read = 4;
  string created_at = 5;
  optional string read_at = 6;
}

message NotificationPage {
  repeated Notification items = 1;
  int32 total = 2;
}