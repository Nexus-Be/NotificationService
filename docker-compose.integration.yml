services:
  notification-service:
    ports: !override
      - "127.0.0.1:8007:8007"
    environment:
      DatabaseInitialization__ApplyMigrationsOnStartup: "false"
      DeliveryWorker__Enabled: "${NOTIFICATION_LIVE_DELIVERIES_ENABLED:-false}"
      EventLogRetention__Enabled: "false"

volumes:
  notification-otp-keys:
    external: true
    name: nexus-notification_notification-otp-keys
