# =============================================================================
# NEXUS NOTIFICATION SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Notification Service kèm Cơ sở dữ liệu riêng:
#   docker compose up -d
# =============================================================================

services:

  # 1. Cơ sở dữ liệu Notification Service (Port 5439)
  notification-db:
    image: postgres:16-alpine
    container_name: nexus-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${NOTIFICATION_DB_PORT:-5439}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Ứng dụng Notification Service gRPC (Port 8007)
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Host=notification-db;Port=5432;Database=notification_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__UseSsl=${SMTP_USE_SSL:-false}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-Nexus Ecosystem}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      notification-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: nexus-network

volumes:
  notification_db_data:
    name: nexus-be_notification_db_data
