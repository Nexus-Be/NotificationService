# =============================================================================
# NEXUS NOTIFICATION SERVICE - DOCKER COMPOSE
# =============================================================================
# Chạy độc lập service này. Database dùng Neon Cloud, hạ tầng dùng chung nexus-network.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-notification

services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      DatabaseInitialization__ApplyMigrationsOnStartup: "${NOTIFICATION_APPLY_MIGRATIONS:-false}"
      ConnectionStrings__DefaultConnection: "${NOTIFICATION_DB_CONNECTION:?NOTIFICATION_DB_CONNECTION is required}"
      Jwt__Issuer: "${JWT_ISSUER:-http://localhost:8001}"
      Jwt__Audience: "${JWT_AUDIENCE:-shoppingcart-api}"
      Jwt__Signature: "${JWT_SIGNATURE:?JWT_SIGNATURE is required}"
      Smtp__Host: "${SMTP_HOST:-smtp.gmail.com}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-false}"
      Smtp__SenderName: "${SMTP_SENDER_NAME:-Nexus Ecosystem}"
      Smtp__SenderEmail: "${SMTP_SENDER_EMAIL:-}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
      DeliveryWorker__Enabled: "${NOTIFICATION_DELIVERY_WORKER_ENABLED:-true}"
      NOTIFICATION_RETRY_LIMIT: "${NOTIFICATION_RETRY_LIMIT:-3}"
      DeliveryWorker__BaseDelaySeconds: "${NOTIFICATION_DELIVERY_BASE_DELAY_SECONDS:-10}"
      DeliveryWorker__PollIntervalSeconds: "${NOTIFICATION_DELIVERY_POLL_SECONDS:-5}"
      DeliveryWorker__AttemptTimeoutSeconds: "${NOTIFICATION_DELIVERY_TIMEOUT_SECONDS:-30}"
      DeliveryWorker__LeaseSeconds: "${NOTIFICATION_DELIVERY_LEASE_SECONDS:-120}"
      EventLogRetention__Enabled: "${NOTIFICATION_EVENT_LOG_RETENTION_ENABLED:-false}"
      EventLogRetention__BatchSize: "${NOTIFICATION_EVENT_LOG_RETENTION_BATCH_SIZE:-500}"
      EventLogRetention__MaxBatchesPerRun: "${NOTIFICATION_EVENT_LOG_RETENTION_MAX_BATCHES:-20}"
      EventLogRetention__IntervalSeconds: "${NOTIFICATION_EVENT_LOG_RETENTION_INTERVAL_SECONDS:-3600}"
      EventLogRetention__RunTimeoutSeconds: "${NOTIFICATION_EVENT_LOG_RETENTION_TIMEOUT_SECONDS:-120}"
      Health__DatabaseTimeoutSeconds: "${NOTIFICATION_HEALTH_DB_TIMEOUT_SECONDS:-15}"
      Health__WorkerGraceSeconds: "${NOTIFICATION_HEALTH_WORKER_GRACE_SECONDS:-30}"
      Health__OtpStallSeconds: "${NOTIFICATION_HEALTH_OTP_STALL_SECONDS:-120}"
      OtpWorker__PollIntervalSeconds: "${NOTIFICATION_OTP_POLL_SECONDS:-1}"
      OtpWorker__SendTimeoutSeconds: "${NOTIFICATION_OTP_TIMEOUT_SECONDS:-30}"
      OtpWorker__LeaseSeconds: "${NOTIFICATION_OTP_LEASE_SECONDS:-120}"
      OtpWorker__MaxAttempts: "${NOTIFICATION_OTP_MAX_ATTEMPTS:-3}"
      OtpWorker__BaseDelaySeconds: "${NOTIFICATION_OTP_BASE_DELAY_SECONDS:-5}"
      OtpProtection__KeyRingPath: "/var/lib/notification/otp-keys"
      OtpProtection__SharedKeyRingBase64: "${OTP_SHARED_KEY_RING_BASE64:-}"
      OtpProtection__RequireSharedKeyRing: "${OTP_REQUIRE_SHARED_KEY_RING:-true}"
      FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${FCM_CREDENTIALS_CONTAINER_PATH:-}"
    volumes:
      - notification-otp-keys:/var/lib/notification/otp-keys
    restart: unless-stopped

volumes:
  notification-otp-keys:

networks:
  default:
    name: nexus-network
    external: true
